name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'firebase/**'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'firebase/functions/package-lock.json'

      - name: Install Dependencies
        working-directory: firebase/functions
        run: npm ci

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Create Key File
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > ${{ github.workspace }}/gcp_key.json

      - name: Deploy to Firebase
        working-directory: firebase
        run: firebase deploy --only functions --non-interactive --project jaimes-backend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp_key.json
